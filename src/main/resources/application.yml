server:
  port: 8081   # 8080 başka bir uygulamada; gerekmiyorsa 8080'e çevirebilirsin

spring:
  application:
    name: cv-rag-bot

  datasource:
    url: jdbc:postgresql://localhost:5433/ragdb
    username: postgres
    password: postgres

# Application config for the hand-rolled RAG pipeline.
app:
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen2.5:7b          # pull: `ollama pull qwen2.5:7b`
    embed-model: nomic-embed-text   # pull: `ollama pull nomic-embed-text`
    temperature: 0.0                # deterministic answers over a fixed CV
    read-timeout-seconds: 120       # LLM generation can take a while locally
    retry:
      max-attempts: 3               # total tries for a transient failure (incl. the first)
      base-delay-ms: 300            # backoff base; grows exponentially per attempt
      max-delay-ms: 3000            # cap on a single backoff wait
  rag:
    # A one-page CV fits entirely in the LLM context, so we retrieve generously.
    # With English-centric nomic-embed-text, a Turkish query can rank the one
    # chunk holding a fact (e.g. Profile's "4 years") LAST — a small top-K would
    # silently drop it. Top-K filtering earns its keep at scale (many documents),
    # not for a single page. See README for the multilingual-embeddings follow-up
    # that makes selective (low top-K) retrieval reliable on Turkish queries.
    top-k: 20
    embedding-dimensions: 768       # MUST match the embed model's output size
  ingestion:
    reload-on-startup: true         # wipe + re-embed cv.md on every boot (dev)
    docs-location: classpath:/docs/cv.md

logging:
  level:
    com.ege.cvrag: INFO
