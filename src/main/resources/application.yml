server:
  port: 8081   # 8080 başka bir uygulamada; gerekmiyorsa 8080'e çevirebilirsin

spring:
  application:
    name: cv-rag-bot

  # Local Docker Postgres by default; override with env vars to point at RDS (or
  # anywhere else) without touching this file — e.g.
  #   export DB_URL=jdbc:postgresql://<rds-endpoint>:5432/ragdb?sslmode=require
  #   export DB_USERNAME=ragadmin DB_PASSWORD=***
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ragdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Only used when app.ingestion.mode=kafka (see below). Harmless in sync mode:
  # no listeners start and the producer is never called, so no broker connection.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: cv-rag-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ege.cvrag.model.ingestion,com.ege.cvrag.model.qa

  # Belt-and-suspenders default: no caching unless app.cache.enabled=true builds its
  # own RedisCacheManager (see CacheConfig). Prevents Boot's own cache
  # auto-configuration from ever reaching for Redis on its own.
  cache:
    type: none

  # Only used when app.cache.enabled=true. Local Docker Redis by default; override
  # to point at AWS ElastiCache the same way DB_URL points RDS.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Application config for the hand-rolled RAG pipeline.
app:
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen2.5:7b          # pull: `ollama pull qwen2.5:7b`
    embed-model: nomic-embed-text   # pull: `ollama pull nomic-embed-text`
    temperature: 0.0                # deterministic answers over a fixed CV
    read-timeout-seconds: 120       # LLM generation can take a while locally
    retry:
      max-attempts: 3               # total tries for a transient failure (incl. the first)
      base-delay-ms: 300            # backoff base; grows exponentially per attempt
      max-delay-ms: 3000            # cap on a single backoff wait
    circuit-breaker:
      failure-threshold: 3          # consecutive failed operations before the circuit opens
      open-wait-ms: 5000            # how long to stay OPEN before a half-open trial
  rag:
    # A one-page CV fits entirely in the LLM context, so we retrieve generously.
    # With English-centric nomic-embed-text, a Turkish query can rank the one
    # chunk holding a fact (e.g. Profile's "4 years") LAST — a small top-K would
    # silently drop it. Top-K filtering earns its keep at scale (many documents),
    # not for a single page. See README for the multilingual-embeddings follow-up
    # that makes selective (low top-K) retrieval reliable on Turkish queries.
    top-k: 20
    embedding-dimensions: 768       # MUST match the embed model's output size
  eval:
    # Smaller k for the evaluation harness so Recall@k / MRR discriminate
    # (production top-k=20 covers the whole CV, making recall trivially 1.0).
    top-k: 5
  agent:
    max-iterations: 5   # safety cap on the agent tool-use loop
    top-k: 5            # chunks the search_cv tool returns per call
  qa:
    # Q&A event stream (observability). When enabled, each /ask publishes a QaEvent
    # to Kafka and a consumer aggregates stats (GET /api/v1/qa/stats). Off by
    # default: no publisher bean, so the RAG path emits nothing. Needs Kafka up.
    events:
      enabled: false
    topic: qa-events
    weak-score-threshold: 0.5   # topScore below this counts as a weak retrieval
  cache:
    # Redis-backed @Cacheable. Off by default — no CacheManager bean, so @Cacheable
    # annotations are inert and no Redis connection is attempted. Run with local
    # Redis (docker compose up -d redis) or point at ElastiCache via REDIS_HOST.
    enabled: false
    github-ttl-minutes: 60   # repo list + language breakdown (also avoids rate limits)
    medium-ttl-minutes: 60   # RSS feed fetch
    ask-ttl-minutes: 10      # /ask answers, keyed by question
  docs:
    # Where the CV Markdown comes from: `classpath` (bundled cv.md) or `s3`.
    # Only one CvDocumentSource / S3DocumentSource is wired in (@ConditionalOnProperty).
    source: classpath               # classpath | s3
    s3:
      bucket: ""                    # e.g. ege-cv-rag-docs (set when source=s3)
      key: cv.md                    # object key inside the bucket
      region: eu-central-1          # AWS region of the bucket
  ingestion:
    # How sources are indexed: `sync` (inline, in-process) or `kafka` (publish one
    # event per source; a consumer indexes them async, with retry + dead-letter).
    mode: sync                      # sync | kafka
    reload-on-startup: true         # wipe + re-embed cv.md on every boot (dev)
    docs-location: classpath:/docs/cv.md
    kafka:
      requests-topic: document-ingest-requests   # DLT is <topic>.DLT
      retry-attempts: 3             # in-place retries before routing to the DLT
      retry-backoff-ms: 1000
  github:
    enabled: true
    user: egecoskun121
    base-url: https://api.github.com
    token: ""                       # optional PAT; empty = unauthenticated (60 req/hr)
  medium:
    enabled: true
    username: "@egecoskun"          # empty feed is fine — indexes 0 chunks, no error
    base-url: https://medium.com/feed

logging:
  level:
    com.ege.cvrag: INFO
