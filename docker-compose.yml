services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cv-rag-pgvector
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 kullanımda: mevcut postgres:12)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Only needed when the app runs
  # with app.ingestion.mode=kafka; the default sync mode ignores it.
  kafka:
    image: apache/kafka:3.8.0
    container_name: cv-rag-kafka
    ports:
      - "9092:9092"   # host clients connect here
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Only needed when app.cache.enabled=true; the default (caching off) ignores it.
  redis:
    image: redis:7-alpine
    container_name: cv-rag-redis
    ports:
      - "6379:6379"

  # Only needed when app.qa.events.enabled=true; validates/stores the QaEvent JSON
  # Schema. Reuses the same Postgres server as pgvector — separate "apicurio" DB
  # (create it once: docker exec cv-rag-pgvector psql -U postgres -c "CREATE DATABASE apicurio").
  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.1
    container_name: cv-rag-apicurio
    ports:
      - "8085:8080"
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apicurio
      APICURIO_DATASOURCE_USERNAME: postgres
      APICURIO_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
